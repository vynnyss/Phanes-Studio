<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
    <title>Phanes Studio</title>
    <style>
      body { margin: 0; background: #19191e; color: #eee; font: 18px system-ui; }
      main { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .spinner { width: 44px; height: 44px; border: 4px solid #404048; border-top-color: #ff7a18; border-radius: 50%; animation: spin 1s linear infinite; }
      p { color: #aaa; }
      .brand-icon { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <img class="brand-icon" src="assets/phanes-studio-minimal.png" alt="">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Phanes Studio</h1>
      <p>Iniciando seu espaço de trabalho…</p>
    </main>
  </body>
</html>
